<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شركة محمد بن عبدالله الخفره | Mohammed Bin Abdullah AlKhafrah Company</title>
<meta name="description" content="شركة محمد بن عبدالله الخفره — الدمام، المملكة العربية السعودية. Mohammed Bin Abdullah AlKhafrah Company — Dammam, Saudi Arabia.">
<meta name="theme-color" content="#4E272E">
<link rel="icon" href="logo.png">

<meta property="og:title" content="شركة محمد بن عبدالله الخفره | Mohammed Bin Abdullah AlKhafrah Company">
<meta property="og:description" content="التزام يُبنى على الثقة — Commitment built on trust.">
<meta property="og:image" content="logo.png">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* exact background color sampled from logo.png */
    --maroon:      #4E272E;
    --gold:        #AF9767;
    --sand:        #D7C6AD;
    --ink:         #20252B;
    --ink-muted:   #8C93A0;

    --ar: "Tajawal", "Segoe UI", system-ui, sans-serif;
    --en: "Cormorant Garamond", Georgia, "Times New Roman", serif;

    --pad: clamp(20px, 5vw, 64px);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ -webkit-text-size-adjust:100%; background:var(--maroon); }

  body{
    min-height:100vh;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    background:var(--maroon);
    color:var(--sand);
    font-family:var(--ar);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Hero ---------- */
  .hero{
    flex:1 0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(28px, 6vh, 56px);
    padding:clamp(56px, 12vh, 120px) var(--pad);
    text-align:center;
    background:var(--maroon);
  }

  /* logo sits on the identical maroon, so its own background disappears */
  .logo{
    width:min(360px, 74vw);
    height:auto;
    display:block;
  }

  .statement{ display:flex; flex-direction:column; align-items:center; gap:18px; }

  .rule{
    width:52px;
    height:1px;
    background:var(--gold);
    opacity:.85;
    border:0;
  }

  h1{
    font-weight:700;
    font-size:clamp(30px, 6.4vw, 60px);
    line-height:1.45;
    color:#FBF7F2;
    max-width:16ch;
  }

  .tagline-en{
    font-family:var(--en);
    font-weight:500;
    font-size:clamp(16px, 2.4vw, 24px);
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--sand);
    opacity:.72;
    direction:ltr;
    margin-top:14px;
  }

  /* ---------- Call to action ---------- */
  .cta{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    padding:16px 46px;
    background:var(--gold);
    color:#3A1A21;
    text-decoration:none;
    font-family:var(--ar);
    font-weight:700;
    font-size:clamp(16px, 2.2vw, 19px);
    line-height:1.4;
    border:1px solid var(--gold);
    transition:background .25s ease, color .25s ease, transform .25s ease;
  }
  .cta .en{
    font-family:var(--en);
    font-weight:600;
    font-size:.78em;
    letter-spacing:.18em;
    text-transform:uppercase;
    direction:ltr;
    opacity:.75;
  }
  .cta:hover,
  .cta:focus-visible{
    background:transparent;
    color:var(--gold);
    transform:translateY(-2px);
  }
  .cta:active{ transform:translateY(0); }

  a:focus-visible{ outline:2px solid var(--sand); outline-offset:4px; }

  /* ---------- Footer ---------- */
  footer{
    flex:0 0 auto;
    background:var(--ink);
    color:var(--ink-muted);
    padding:clamp(26px, 4vw, 38px) var(--pad);
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:26px 48px;
  }

  .contact{ display:flex; flex-wrap:wrap; gap:26px 48px; order:1; }

  .field{
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:5px;
    text-align:start;
  }

  .field .label{
    font-size:12px;
    letter-spacing:.08em;
    color:var(--ink-muted);
    opacity:.75;
  }
  .field .label .en{
    font-family:var(--en);
    letter-spacing:.14em;
    text-transform:uppercase;
    font-size:11px;
  }

  .field .value{
    font-weight:700;
    font-size:clamp(14px, 1.6vw, 16px);
    color:#E9E4DC;
    text-decoration:none;
    line-height:1.6;
  }
  .field .value .en{
    display:block;
    font-family:var(--en);
    font-weight:500;
    font-size:.9em;
    letter-spacing:.04em;
    color:var(--ink-muted);
    unicode-bidi:isolate;
  }
  a.value:hover{ color:var(--gold); }

  .copyright{
    order:2;
    font-family:var(--en);
    font-size:13px;
    letter-spacing:.06em;
    line-height:1.7;
    text-align:start;
    unicode-bidi:isolate;
    opacity:.7;
  }
  .copyright .ar{
    display:block;
    font-family:var(--ar);
    font-size:12px;
    unicode-bidi:isolate;
  }

  /* ---------- Entrance ---------- */
  .reveal{ opacity:0; transform:translateY(14px); animation:rise .9s cubic-bezier(.2,.7,.3,1) forwards; }
  .d1{ animation-delay:.05s; } .d2{ animation-delay:.35s; } .d3{ animation-delay:.6s; }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  @media (prefers-reduced-motion:reduce){
    .reveal{ animation:none; opacity:1; transform:none; }
    .cta{ transition:none; }
    .cta:hover{ transform:none; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width:720px){
    .cta{ width:100%; max-width:340px; padding:16px 24px; }

    /* one centered column — no mixed left/right edges */
    footer{
      flex-direction:column;
      align-items:center;
      text-align:center;
      gap:0;
      padding-bottom:calc(clamp(26px, 4vw, 38px) + env(safe-area-inset-bottom, 0px));
    }
    .contact{
      order:1;
      flex-direction:column;
      align-items:center;
      width:100%;
      gap:22px;
    }
    .field{ align-items:center; text-align:center; gap:6px; }
    .field .label{ font-size:11px; }
    .field .value{ font-size:16px; }
    .field .value .en{ font-size:.85em; margin-top:2px; }

    .copyright{
      order:2;
      width:100%;
      margin-top:26px;
      padding-top:22px;
      border-top:1px solid rgba(255,255,255,.10);
      text-align:center;
      font-size:12px;
    }
    .copyright .ar{ margin-top:4px; }
  }
</style>
</head>

<body>

  <main class="hero">
    <img class="logo reveal d1" src="logo.png"
         alt="شركة محمد بن عبدالله الخفره — Mohammed Bin Abdullah AlKhafrah Company">

    <div class="statement reveal d2">
      <hr class="rule">
      <h1>التزام يُبنى على الثقة</h1>
      <p class="tagline-en">Commitment built on trust</p>
    </div>

    <a class="cta reveal d3" href="mailto:info@khafrah.sa">
      تواصل معنا
      <span class="en">Contact us</span>
    </a>
  </main>

  <footer>
    <div class="contact">
      <div class="field">
        <span class="label">البريد الإلكتروني <span class="en">Email</span></span>
        <a class="value" href="mailto:info@khafrah.sa"><bdi>info@khafrah.sa</bdi></a>
      </div>

      <div class="field">
        <span class="label">الموقع <span class="en">Location</span></span>
        <span class="value">
          الدمام، المملكة العربية السعودية
          <span class="en"><bdi>Dammam, Saudi Arabia</bdi></span>
        </span>
      </div>
    </div>

    <div class="copyright">
      <span class="ar"><bdi>جميع الحقوق محفوظة — شركة محمد بن عبدالله الخفره</bdi></span>
      <bdi>© <span id="year">2026</span> Mohammed Bin Abdullah AlKhafrah Company</bdi>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
